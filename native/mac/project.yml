name: BguruChat
options:
  bundleIdPrefix: fm.backspace
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  BguruChat:
    type: application
    platform: macOS
    sources:
      - path: BguruChat/Sources
      - path: BguruChat/Resources
        buildPhase: resources
    info:
      path: BguruChat/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "backspace.fm"
    entitlements:
      path: BguruChat/BguruChat.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat
        PRODUCT_NAME: B-guru Chat
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
