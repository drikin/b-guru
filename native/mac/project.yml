name: BguruChat
options:
  bundleIdPrefix: fm.backspace
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # Auto-update. Pinned exactly; bump deliberately after reading the release notes.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  # Voice room (LiveKit, Apache-2.0, official SDK). Pinned exactly like Sparkle.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    revision: 07d7d04ba0b284ad485e82696b0e88009c4df54a   # tag 2.17.0 (Package.resolved is not in git, so pin the commit)
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Debug = local builds: sign with the team's Apple Development certificate so
    # macOS keeps the mic / Keychain permissions across rebuilds (an ad-hoc
    # signature is a new app to macOS every build, so it asked every time).
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: F9349EVF2K
    # Release = what members download: Developer ID + hardened runtime +
    # secure timestamp (both required for notarization).
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: F9349EVF2K
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Universal: Apple silicon + Intel Macs.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  BguruChat:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
      - package: LiveKit
    sources:
      - path: BguruChat/Sources
      - path: ../shared          # shared with the iOS/iPadOS app
      - path: BguruChat/Resources
        buildPhase: resources
    info:
      path: BguruChat/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "backspace.fm"
        # Sparkle: members-only appcast (the app sends its own token), EdDSA-signed updates.
        SUFeedURL: https://bsm.backspace.fm/api/download/mac/appcast.xml
        SUPublicEDKey: "fcyKhDlgelqKcS38AIf0NHikBD46VtJHJxqgLNVDCNM="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        # Sandboxed app: the installer runs through Sparkle's launcher XPC service.
        SUEnableInstallerLauncherService: true
        NSMicrophoneUsageDescription: ボイスルームで話すときだけマイクを使います。録音はしません。
    entitlements:
      path: BguruChat/BguruChat.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Voice room: the microphone, only while in the room.
        com.apple.security.device.audio-input: true
        # Voice room: WebRTC receives the audio over UDP on sockets it binds itself,
        # which the sandbox treats as "incoming connections" (LiveKit's own test host has it too).
        com.apple.security.network.server: true
        # Read the images a member chooses (file picker / drag & drop) to attach to a post.
        com.apple.security.files.user-selected.read-only: true
        # Sparkle installer (sandboxed apps): talk to its XPC services.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - fm.backspace.bguru.chat-spks
          - fm.backspace.bguru.chat-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat
        PRODUCT_NAME: B-guru Chat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # iPhone / iPad (universal). Shares native/shared with the Mac app.
  BguruChatiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: BguruChatNSE
      - package: LiveKit
    entitlements:
      path: ../ios/BguruChat.entitlements
      properties:
        aps-environment: development   # Xcode builds; TestFlight / App Store export switches to production
        keychain-access-groups:
          - $(AppIdentifierPrefix)fm.backspace.bguru.chat.shared
    sources:
      - path: ../ios/Sources
      - path: ../shared
      - path: ../ios/Resources
        buildPhase: resources
    info:
      path: ../ios/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen:
          UIColorName: ""
        # All orientations + no UIRequiresFullScreen → iPad Split View / Slide Over / Stage Manager.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: ボイスルームで話すときだけマイクを使います。録音はしません。
        # The camera takes a photo for a post or a chat message (「カメラで撮る」).
        NSCameraUsageDescription: タイムラインやチャットに付ける写真をその場で撮るときにカメラを使います。
        # Keep the voice room going with the screen off / in another app.
        # remote-notification: 既読で知らせを消す (read_sync, a background push) runs without opening the app.
        UIBackgroundModes:
          - audio
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat
        PRODUCT_NAME: B-guru Chat
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: F9349EVF2K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  # Notification Service Extension: fetches the real text of a push (the server
  # sends ids only) with the token shared through the Keychain access group.
  BguruChatNSE:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../ios/NSE
      - path: ../shared/Keychain.swift
    info:
      path: ../ios/NSE/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat 通知
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: ../ios/NSE/BguruChatNSE.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)fm.backspace.bguru.chat.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat.nse
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: F9349EVF2K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  # Unit tests of the pure logic (no app host): `xcodebuild test -scheme BguruChatTests`.
  BguruChatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ../shared/ReadSync.swift
      - path: ../shared/ChatSpeech.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
