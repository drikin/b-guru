name: BguruChat
options:
  bundleIdPrefix: fm.backspace
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # Auto-update. Pinned exactly; bump deliberately after reading the release notes.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Release = what members download: Developer ID + hardened runtime +
    # secure timestamp (both required for notarization).
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: F9349EVF2K
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Universal: Apple silicon + Intel Macs.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  BguruChat:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: BguruChat/Sources
      - path: ../shared          # shared with the iOS/iPadOS app
      - path: BguruChat/Resources
        buildPhase: resources
    info:
      path: BguruChat/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "backspace.fm"
        # Sparkle: members-only appcast (the app sends its own token), EdDSA-signed updates.
        SUFeedURL: https://bsm.backspace.fm/api/download/mac/appcast.xml
        SUPublicEDKey: "fcyKhDlgelqKcS38AIf0NHikBD46VtJHJxqgLNVDCNM="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        # Sandboxed app: the installer runs through Sparkle's launcher XPC service.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: BguruChat/BguruChat.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sparkle installer (sandboxed apps): talk to its XPC services.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - fm.backspace.bguru.chat-spks
          - fm.backspace.bguru.chat-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat
        PRODUCT_NAME: B-guru Chat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # iPhone / iPad (universal). Shares native/shared with the Mac app.
  BguruChatiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../ios/Sources
      - path: ../shared
      - path: ../ios/Resources
        buildPhase: resources
    info:
      path: ../ios/Info.plist
      properties:
        CFBundleDisplayName: B-guru Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen:
          UIColorName: ""
        # All orientations + no UIRequiresFullScreen → iPad Split View / Slide Over / Stage Manager.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.backspace.bguru.chat
        PRODUCT_NAME: B-guru Chat
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: F9349EVF2K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
