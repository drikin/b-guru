name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The E2E guard tests production, so it must run AFTER a deploy, not on push.
  # deploy.sh triggers it with `gh workflow run ci.yml` once the new build is
  # serving. See the e2e-regression job for why.
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # ビルド時に必要な環境変数（ダミー値。実行時は本番の .env を使用）
          APP_URL: "https://bsm.backspace.fm"
          GHOST_ADMIN_API_URL: "https://backspace.fm"
          GHOST_ADMIN_API_KEY: "dummy:key"
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"

  # The unit tests above pin the *shape* of the fixes; this job pins the
  # *behaviour* against the real production site. It exists because the chat
  # scroll bug regressed twice: a change that passed unit tests and built
  # cleanly still broke the real UI, and only a real browser caught it.
  #
  # It runs against production rather than a local server because the bugs it
  # guards are layout-dependent and need real data (avatars, images, a long
  # message list). A local build with an empty database would pass vacuously.
  #
  # ⚠️ Because it tests PRODUCTION, it can only pass once the commit has been
  # DEPLOYED. Running it on every push meant it graded the *previous* deploy
  # against the *new* expectations, so any commit that changed the UI failed
  # here until `scripts/deploy.sh` ran — one failure email per commit, which is
  # what flooded drikin's inbox (2026-09-24). The job is therefore manual
  # (`workflow_dispatch`) and is run by deploy.sh AFTER the code is live, where
  # a failure is meaningful. `continue-on-error` is NOT used: a real regression
  # must still be visible.
  #
  # Requires the E2E_SESSION repo secret: a valid bsm_session token. Rotate it
  # by minting a new row in the sessions table and updating the secret.
  e2e-regression:
    name: E2E Regression Guard
    runs-on: ubuntu-latest
    # Manual only — see the note above. deploy.sh triggers this via
    # `gh workflow run` once the new build is serving.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E regression guard
        run: npm run e2e
        env:
          BSM_SESSION: ${{ secrets.E2E_SESSION }}
          BASE_URL: "https://bsm.backspace.fm"
