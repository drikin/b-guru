name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The E2E guard tests production, so it must run AFTER a deploy, not on push.
  # deploy.sh triggers it with `gh workflow run ci.yml` once the new build is
  # serving. See the e2e-regression job for why.
  workflow_dispatch:

# Read-only: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # ビルド時に必要な環境変数（ダミー値。実行時は本番の .env を使用）
          APP_URL: "https://bsm.backspace.fm"
          GHOST_ADMIN_API_URL: "https://backspace.fm"
          GHOST_ADMIN_API_KEY: "dummy:key"
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"

  # 本物の PostgreSQL を使う DB テスト（将棋・ミニゲーム・タイムラインの操作）。使い捨ての Postgres を
  # services で立て、テストごとに別の database を渡す（同じ DB だと initSchema が同時に走ってぶつかる）。
  # ファイルは 1 つずつ順に流す（--no-file-parallelism）。手元では 20 秒ほど。本番の DB には触らない。
  db-tests:
    name: DB tests (disposable Postgres)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHOGI_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/shogi
      MINIGAME_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/minigame
      TIMELINE_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/timeline
      BEAGLE_AI_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/beagleai
      DM_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/dm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create test databases
        env:
          PGPASSWORD: ci-only
        run: |
          for d in shogi minigame timeline beagleai dm; do
            psql -h localhost -U postgres -c "CREATE DATABASE $d"
          done

      - name: Run DB tests
        run: >-
          npx vitest run --no-file-parallelism
          src/lib/__tests__/shogi-db.test.ts
          src/lib/__tests__/shogi-commentary-db.test.ts
          src/lib/__tests__/minigame-db.test.ts
          src/lib/__tests__/operations-db.test.ts
          src/lib/__tests__/beagle-ondevice-db.test.ts
          src/lib/__tests__/dm-db.test.ts

  # Android の単体テスト。タイムラインの例題（src/lib/__tests__/fixtures/timeline/）を
  # アプリの自前計算にも読ませ、Web・サーバとずれたら落とす（docs/timeline-spec.md §9）。
  # Gradle の初回は数分かかるので、Node のジョブとは別に並列で走らせる（全体の時間を延ばさない）。
  # 署名鍵・本番の設定は使わない（debug の単体テストだけ）。
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 既定の packages（"tools platform-tools"）の "tools" は新しい cmdline-tools に無く、sdkmanager が
      # 終了コード 1 で止まる（2026-10 から）。入れるものを明示する。compileSdk 37 の platform もここで入れる
      # （AGP にビルドの途中で取りに行かせない）。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest


  # *behaviour* against the real production site. It exists because the chat
  # scroll bug regressed twice: a change that passed unit tests and built
  # cleanly still broke the real UI, and only a real browser caught it.
  #
  # It runs against production rather than a local server because the bugs it
  # guards are layout-dependent and need real data (avatars, images, a long
  # message list). A local build with an empty database would pass vacuously.
  #
  # ⚠️ Because it tests PRODUCTION, it can only pass once the commit has been
  # DEPLOYED. Running it on every push meant it graded the *previous* deploy
  # against the *new* expectations, so any commit that changed the UI failed
  # here until `scripts/deploy.sh` ran — one failure email per commit, which is
  # what flooded drikin's inbox (2026-09-24). The job is therefore manual
  # (`workflow_dispatch`) and is run by deploy.sh AFTER the code is live, where
  # a failure is meaningful. `continue-on-error` is NOT used: a real regression
  # must still be visible.
  #
  # ⚠️ deploy.sh only triggers this when its OWN run of the same guard passed,
  # and `--no-ci` suppresses it entirely for degrade-proof runs (where the build
  # is broken on purpose and a failure email would be pure noise).
  #
  # Requires the E2E_SESSION repo secret: a valid bsm_session token. Rotate it
  # by minting a new row in the sessions table and updating the secret.
  e2e-regression:
    name: E2E Regression Guard
    runs-on: ubuntu-latest
    # Manual only — see the note above. deploy.sh triggers this via
    # `gh workflow run` once the new build is serving.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E regression guard
        run: npm run e2e
        env:
          BSM_SESSION: ${{ secrets.E2E_SESSION }}
          BASE_URL: "https://bsm.backspace.fm"
