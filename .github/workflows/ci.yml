name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # ビルド時に必要な環境変数（ダミー値。実行時は本番の .env を使用）
          APP_URL: "https://bsm.backspace.fm"
          GHOST_ADMIN_API_URL: "https://backspace.fm"
          GHOST_ADMIN_API_KEY: "dummy:key"
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
